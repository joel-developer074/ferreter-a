{# Formulario para editar los datos de un proveedor. #}
{% extends 'base.html' %}{% block content %}<h1>Editar proveedor</h1><form method="post" class="form-grid"><label>Nombre del contacto<input name="name" value="{{supplier.name}}" required></label><label>Empresa (opcional)<input name="company_name" value="{{supplier.company_name}}"></label><label>Teléfono<input name="phone" value="{{supplier.phone}}"></label><label>Email<input name="email" type="email" value="{{supplier.email}}"></label><label class="wide">Notas<textarea name="notes">{{supplier.notes}}</textarea></label><div class="form-actions"><button class="action-save">Guardar cambios</button><a class="button secondary" href="{{url_for('suppliers')}}">Cancelar</a></div></form>{% endblock %}
