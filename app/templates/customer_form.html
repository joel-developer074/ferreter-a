{# Formulario para editar los datos y el descuento de un cliente. #}
{% extends 'base.html' %}{% block content %}<h1>Editar cliente</h1><form method="post" class="form-grid"><label>Nombre<input name="first_name" value="{{customer.first_name}}" required></label><label>Apellido<input name="last_name" value="{{customer.last_name}}" required></label><label>Teléfono / celular<input name="phone" value="{{customer.phone}}"></label><label>Dirección<input name="address" value="{{customer.address}}"></label><label>Descuento (%)<input name="discount_percent" type="number" min="0" max="100" step="0.01" value="{{customer.discount_percent}}"></label><div class="form-actions"><button class="action-save">Guardar cambios</button><a class="button secondary" href="{{url_for('customers')}}">Cancelar</a></div></form>{% endblock %}
